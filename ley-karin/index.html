<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ley Karin: video de introducción — Montilabs</title>
  <meta name="description" content="Módulo de capacitación sobre la Ley Karin (N° 21.643): qué protege, qué no es acoso y cómo funciona el protocolo."/>
  <!-- Quitar noindex cuando el contenido legal esté validado y el quiz publicado. -->
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#1F3A5F"/>
  <link rel="canonical" href="https://montilabs.cl/ley-karin/"/>

  <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/ibm-plex-sans-latin.woff2") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-2193, U+2212, U+2215; }
    @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/ibm-plex-sans-latin-ext.woff2") format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF; }

    :root {
      --bg: #F7F3EC;
      --sand: #EFE6D8;
      --sand-2: #D9CDB8;
      --line: #E3DACB;
      --ink: #16263F;
      --ink-2: #4A5568;
      --navy: #1F3A5F;
      --clay: #9A5636;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--clay); outline-offset: 3px; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1240px; margin: 0 auto; padding: 18px 24px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; }
    .brand img { display: block; width: 30px; height: 30px; }
    .bar-label { font-size: 15px; font-weight: 600; color: var(--ink-2); }

    main { max-width: 1240px; margin: 0 auto; padding: 8px 24px 64px; }
    h1 { margin: 12px 0 4px; font-size: clamp(30px, 4vw, 42px); line-height: 1.1; letter-spacing: -0.02em; }
    .sub { margin: 0 0 24px; font-size: 18px; color: var(--ink-2); }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
    .player { position: relative; overflow: hidden; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--sand); }
    .player video { display: block; width: 100%; height: 100%; }
    /* Vuelve clicable el botón "Continuar al quiz" que aparece dentro del video. */
    .video-hit { position: absolute; left: 61.5%; top: 68.5%; width: 23.8%; height: 9.4%; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .video-hit[hidden] { display: none; }

    .steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .step { padding: 16px 18px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-weight: 600; color: var(--ink-2); }
    .step[aria-current="step"] { border-color: var(--sand-2); background: var(--sand-2); color: var(--ink); }

    .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 18px; }
    .hint { margin: 0; font-size: 15px; color: var(--ink-2); }
    .btn { padding: 14px 26px; border: 0; border-radius: 12px; background: var(--navy); color: #fff; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: background .25s ease; }
    .btn:hover:not(:disabled) { background: var(--ink); }
    .btn:disabled { background: var(--sand-2); color: var(--ink-2); cursor: not-allowed; }

    .quiz { margin-top: 32px; padding: 28px; border-radius: 12px; background: var(--sand); }
    .quiz[hidden] { display: none; }
    .quiz h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.01em; }
    .quiz p { margin: 0; color: var(--ink-2); }

    @media (max-width: 860px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .steps { grid-template-columns: 1fr 1fr; }
      .step { padding: 12px 14px; font-size: 15px; }
      .actions { justify-content: flex-start; }
      .btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="montilabs, inicio"><img src="/favicon.svg" alt="" width="30" height="30" /><span>montilabs</span></a>
    <span class="bar-label">Capacitación</span>
  </header>

  <main>
    <h1>Ley Karin</h1>
    <p class="sub">Video de introducción</p>

    <div class="layout">
      <div>
        <div class="player">
          <video id="video" controls playsinline preload="metadata" poster="/assets/screenshots/ley-karin.jpg" aria-label="Video de introducción a la Ley Karin, con subtítulos incluidos">
            <source src="/assets/videos/ley-karin-introduccion.mp4" type="video/mp4" />
            Tu navegador no puede reproducir este video.
          </video>
          <button id="video-hit" class="video-hit" type="button" tabindex="-1" aria-hidden="true" hidden></button>
        </div>
        <div class="actions">
          <p id="hint" class="hint">Se habilita al terminar el video.</p>
          <button id="continue" class="btn" type="button" disabled>Continuar al quiz →</button>
        </div>
      </div>

      <ol class="steps" aria-label="Pasos del módulo">
        <li id="step-1" class="step" aria-current="step">1. Video de introducción</li>
        <li id="step-2" class="step">2. Casos prácticos</li>
      </ol>
    </div>

    <section id="quiz" class="quiz" aria-labelledby="quiz-title" hidden>
      <h2 id="quiz-title" tabindex="-1">Casos prácticos</h2>
      <p>Esta parte del módulo estará disponible próximamente.</p>
    </section>
  </main>

  <script>
    (function () {
      var video = document.getElementById('video');
      var hit = document.getElementById('video-hit');
      var btn = document.getElementById('continue');
      var hint = document.getElementById('hint');
      var quiz = document.getElementById('quiz');
      var title = document.getElementById('quiz-title');
      var step1 = document.getElementById('step-1');
      var step2 = document.getElementById('step-2');
      // Segundo en que el botón aparece dentro del video.
      var BUTTON_AT = 58;

      function unlock() {
        btn.disabled = false;
        hint.hidden = true;
      }

      function openQuiz() {
        unlock();
        video.pause();
        quiz.hidden = false;
        step1.removeAttribute('aria-current');
        step2.setAttribute('aria-current', 'step');
        title.focus({ preventScroll: true });
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        quiz.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      }

      video.addEventListener('timeupdate', function () {
        var ready = video.currentTime >= BUTTON_AT;
        hit.hidden = !ready;
        if (ready) unlock();
      });
      video.addEventListener('ended', unlock);
      hit.addEventListener('click', openQuiz);
      btn.addEventListener('click', openQuiz);
    })();
  </script>
</body>
</html>
